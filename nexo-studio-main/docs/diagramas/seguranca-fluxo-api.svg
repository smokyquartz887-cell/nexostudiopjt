<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title"><title id="title">Fluxo de segurança da API do chatbot</title><rect width="1000" height="560" rx="20" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Fluxo protegido da API do chatbot</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="300" y="70" width="400" height="54" rx="12" fill="#1e3a8a"/><text x="500" y="103" font-size="17" fill="#fff" font-weight="700">POST /api/chat/&lt;slug&gt;/</text><path d="M500 124 V153" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="160" width="400" height="60" rx="12" fill="#cffafe" stroke="#0891b2"/><text x="500" y="185" font-size="16" font-weight="700" fill="#164e63">1. Método, Content-Type e tamanho</text><text x="500" y="205" font-size="13" fill="#155e75">Rejeita método ou payload inválido</text><path d="M500 220 V249" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="256" width="400" height="60" rx="12" fill="#cffafe" stroke="#0891b2"/><text x="500" y="281" font-size="16" font-weight="700" fill="#164e63">2. Rate limit por IP</text><text x="500" y="301" font-size="13" fill="#155e75">Excesso retorna HTTP 429</text><path d="M500 316 V345" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="352" width="400" height="60" rx="12" fill="#cffafe" stroke="#0891b2"/><text x="500" y="377" font-size="16" font-weight="700" fill="#164e63">3. Valida pergunta e identifica negócio</text><text x="500" y="397" font-size="13" fill="#155e75">A FAQ é consultada só no negócio do slug</text><path d="M500 412 V441" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="448" width="400" height="60" rx="12" fill="#0f766e"/><text x="500" y="473" font-size="16" font-weight="700" fill="#fff">4. Resposta JSON + histórico</text><text x="500" y="493" font-size="13" fill="#ccfbf1">Sem retornar dados de outras empresas</text></g></svg>
