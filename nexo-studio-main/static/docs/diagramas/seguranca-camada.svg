<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Camada de segurança do Nexo Studio</title><desc id="desc">Diagrama da interface e API, camada central de segurança e recursos internos.</desc>
